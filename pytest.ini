[pytest]
testpaths = app/tests
norecursedirs = scratch .venv venv node_modules
markers =
    unit: pruebas rápidas sin servidor externo ni assets multimedia completos
    integration: pruebas de integración contra la aplicación ASGI local
    assets: pruebas que requieren catálogos, videos, avatar o modelos locales
    e2e: pruebas de navegador con Playwright
    live_server: pruebas que requieren un servidor en 127.0.0.1:8000
